<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelly Greens — Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="shop">Kelly Greens</div>
        <div class="tagline">Time clock</div>
      </div>
      <div class="live-clock" id="liveClock">
        <div class="time" id="liveTime">--:--</div>
        <div class="date" id="liveDate">—</div>
      </div>
    </header>

    <section class="clock-grid" id="clockGrid">
      <!-- employee cards injected by app.js -->
    </section>

    <div class="perf" aria-hidden="true"></div>

    <section class="summary">
      <div class="section-head">
        <h2>Monthly totals</h2>
        <input type="month" id="monthSelect">
      </div>
      <div class="totals-grid" id="summaryTable"></div>
    </section>

    <div class="perf" aria-hidden="true"></div>

    <section class="log">
      <div class="section-head">
        <h2>Log</h2>
        <button id="addEntryBtn" class="add-btn">+ Add entry</button>
      </div>
      <table id="logTable">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>In</th>
            <th>Out</th>
            <th class="num">Hours</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
